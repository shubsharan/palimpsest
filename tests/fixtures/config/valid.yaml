schemaVersion: 5

communication: { teamChannel: disabled }

blocks:
  - {
      blockId: calibration-odd-women,
      phase: calibration,
      sourcePath: fixtures/chronicles-of-break-oday.txt,
    }
  - { blockId: validation-pointed-firs, phase: validation, sourcePath: fixtures/367-h.htm }
  - { blockId: validation-custom-country, phase: validation, sourcePath: fixtures/pg11052.txt }
  - { blockId: validation-woodlanders, phase: validation, sourcePath: fixtures/pg482.txt }
  - { blockId: validation-silas-lapham, phase: validation, sourcePath: fixtures/pg154.txt }

assignment:
  - { agentId: agent-1, modelProfileId: gpt }
  - { agentId: agent-2, modelProfileId: claude }
  - { agentId: agent-3, modelProfileId: gemini }

providers:
  openai: { driver: openai, apiKeyEnv: RESEARCH_OPENAI_KEY }
  anthropic: { driver: anthropic, apiKeyEnv: RESEARCH_ANTHROPIC_KEY }
  google: { driver: google, apiKeyEnv: RESEARCH_GOOGLE_KEY }
  local: { driver: openai-compatible, baseURL: "http://127.0.0.1:4000/v1" }

models:
  gpt:
    provider: openai
    model: gpt-research
    settings: { maxOutputTokens: 4096, temperature: 0.2, topP: 0.9, seed: 7 }
  claude:
    provider: anthropic
    model: claude-research
    providerOptions: { anthropic: { effort: low } }
  gemini: { provider: google, model: gemini-research }
  local: { provider: local, model: local-research }

schedule:
  releaseOffsetsMs: [0, 300000, 600000, 1200000, 1800000, 2400000]
  cutoffMs: 3600000

budgets:
  tokenBudgetPerAgent: 200000
  perAttemptMonetaryCeilingCents: 10000
  totalTokenCeiling: 15000000
  totalMonetaryCeilingCents: 250000

orders:
  calibration: [CS, CR, IR, IS]
  validation:
    - [CS, CR, IR, IS]
    - [CR, IS, CS, IR]
    - [IS, IR, CR, CS]
    - [IR, CS, IS, CR]

checking:
  feedbackId: published-runnability-coverage-v1
scoring:
  primaryMetricId: normalized-positional-word-v1
  diagnosticMetricId: palimpsest-diagnostics-v1
  evaluationPolicyId: all-canonical-main-snapshots-v1

rubric:
  rubricId: fixture-behavior-review-v1
  path: tests/fixtures/config/behavior-rubric.md
  sha256: 27397411faadcf7048e6d5e832c6d799884cbb9bd2e4d66344d358429902ea5b

adjustableFields:
  - budgets.tokenBudgetPerAgent
  - budgets.perAttemptMonetaryCeilingCents

failurePolicy:
  stopOnInfrastructureFailure: true
  automaticRetry: false
  replacement: explicit-appended
  eligibleClassification: session-infrastructure-error
