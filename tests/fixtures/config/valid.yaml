schemaVersion: 2
name: manifest-test
models:
  gpt: { provider: openai, model: gpt-research, reasoningEffort: medium }
runs:
  shared:
    source: fixtures/corpus/fortunes-fool.txt
    agents: 3
    model: gpt
    communication: shared
    releases: [0m, 5m, 10m, 20m, 30m, 40m]
    cutoff: 1h
    spendCeilingCents: 10000
  isolated-rekey:
    source: fixtures/corpus/fortunes-fool.txt
    agents: 3
    model: gpt
    communication: isolated
    releases: [0m, 5m, 10m, 20m, 30m, 40m]
    cutoff: 1h
    rekeyAtStage: 4
    tokenLimitPerAgent: 200000
    spendCeilingCents: 10000
