schemaVersion: 2
name: fortunes-fool-rekey-stage-4-gpt-5-6-sol-high-90m

models:
  sol:
    provider: openai
    model: gpt-5.6-sol
    reasoningEffort: high

runs:
  shared-rekey:
    source: fixtures/corpus/fortunes-fool.txt
    agents: 3
    model: sol
    communication: shared
    releases: [0m, 5m, 10m, 20m, 30m, 40m]
    cutoff: 90m
    rekeyAtStage: 4
    spendCeilingCents: 10000
    checker: false
