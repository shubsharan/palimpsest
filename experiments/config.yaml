schemaVersion: 1

providers:
  openai:
    driver: openai
    apiKeyEnv: OPENAI_API_KEY

models:
  sol:
    provider: openai
    model: gpt-5.6-sol
    settings:
      maxOutputTokens: 32768
    providerOptions:
      openai:
        reasoningEffort: medium
        reasoningSummary: detailed
        serviceTier: default
        store: false

totalSpendCeilingCents: 25000

runs:
  - id: theron-ware-shared-stationary
    fixture: { packagePath: artifacts/fixtures/calibration-theron-ware, variant: stationary }
    assignment: { agent-1: sol, agent-2: sol, agent-3: sol }
    capabilities: { git: shared, teamRoom: enabled }
    schedule:
      { releaseOffsetsMs: [0, 300000, 600000, 1200000, 1800000, 2400000], cutoffMs: 3600000 }
    limits: { tokenLimitPerAgent: 500000, spendCeilingCents: 1000 }
    labels: { fixture: theron-ware, communication: shared, keying: stationary }
  - id: theron-ware-shared-rekey
    fixture: { packagePath: artifacts/fixtures/calibration-theron-ware, variant: rekey }
    assignment: { agent-1: sol, agent-2: sol, agent-3: sol }
    capabilities: { git: shared, teamRoom: enabled }
    schedule:
      { releaseOffsetsMs: [0, 300000, 600000, 1200000, 1800000, 2400000], cutoffMs: 3600000 }
    limits: { tokenLimitPerAgent: 500000, spendCeilingCents: 1000 }
    labels: { fixture: theron-ware, communication: shared, keying: rekey }
  - id: theron-ware-isolated-rekey
    fixture: { packagePath: artifacts/fixtures/calibration-theron-ware, variant: rekey }
