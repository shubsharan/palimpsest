schemaVersion: 2

blocks:
  - blockId: calibration-theron-ware
    phase: calibration
  - blockId: validation-odd-women
    phase: validation
  - blockId: validation-pointed-firs
    phase: validation
  - blockId: validation-custom-country
    phase: validation
  - blockId: validation-woodlanders
    phase: validation

assignment:
  - agentId: agent-1
    modelProfileId: gpt
  - agentId: agent-2
    modelProfileId: claude
  - agentId: agent-3
    modelProfileId: gemini

providers:
  openai:
    driver: openai
    apiKeyEnv: OPENAI_API_KEY
  anthropic:
    driver: anthropic
    apiKeyEnv: ANTHROPIC_API_KEY
  google:
    driver: google
    apiKeyEnv: GOOGLE_GENERATIVE_AI_API_KEY

models:
  gpt:
    provider: openai
    model: gpt-5.2
  claude:
    provider: anthropic
    model: claude-opus-4-6
  gemini:
    provider: google
    model: gemini-3.1-pro-preview

schedule:
  releaseOffsetsMs: [0, 300000, 600000, 1200000, 1800000, 2400000]
  cutoffMs: 3600000

budgets:
  tokenBudgetPerAgent: 200000
  perAttemptMonetaryCeilingCents: 10000
  totalTokenCeiling: 15000000
  totalMonetaryCeilingCents: 250000

orders:
  calibration: [CS, CR, IR, IS]
  validation:
    - [CS, CR, IR, IS]
    - [CR, IS, CS, IR]
    - [IS, IR, CR, CS]
    - [IR, CS, IS, CR]

scoring:
  metricId: normalized-positional-word-v1
  reviewerSelectionId: manual-workspace-command-output-v1

rubric:
  rubricId: palimpsest-behavior-review-v1
  path: experiments/behavior-rubric.md
  sha256: c86123324228a33ab2e1044f48b5205c06fc7b900fd44b17ff5c4f5fbd7201c6

adjustableFields:
  - budgets.tokenBudgetPerAgent
  - budgets.perAttemptMonetaryCeilingCents

failurePolicy:
  stopOnInfrastructureFailure: true
  automaticRetry: false
  replacement: explicit-appended
  eligibleClassification: session-infrastructure-error
