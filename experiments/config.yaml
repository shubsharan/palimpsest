schemaVersion: 3

communication:
  teamChannel: enabled

blocks:
  - blockId: calibration-theron-ware
    phase: calibration
  - blockId: validation-odd-women
    phase: validation
  - blockId: validation-pointed-firs
    phase: validation
  - blockId: validation-custom-country
    phase: validation
  - blockId: validation-woodlanders
    phase: validation

assignment:
  - agentId: agent-1
    modelProfileId: sol
  - agentId: agent-2
    modelProfileId: sol
  - agentId: agent-3
    modelProfileId: sol

providers:
  openai:
    driver: openai
    apiKeyEnv: OPENAI_API_KEY

models:
  sol:
    provider: openai
    model: gpt-5.6-sol
    settings:
      maxOutputTokens: 32768
    providerOptions:
      openai:
        reasoningEffort: medium
        reasoningSummary: detailed
        serviceTier: default
        store: false

schedule:
  releaseOffsetsMs: [0, 300000, 600000, 1200000, 1800000, 2400000]
  cutoffMs: 3600000

budgets:
  tokenBudgetPerAgent: 500000
  perAttemptMonetaryCeilingCents: 1000
  totalTokenCeiling: 37500000
  totalMonetaryCeilingCents: 25000

orders:
  calibration: [CS, CR, IR, IS]
  validation:
    - [CS, CR, IR, IS]
    - [CR, IS, CS, IR]
    - [IS, IR, CR, CS]
    - [IR, CS, IS, CR]

scoring:
  metricId: normalized-positional-word-v1
  reviewerSelectionId: selected-workspace-main-snapshot-v1

rubric:
  rubricId: palimpsest-behavior-review-v1
  path: experiments/behavior-rubric.md
  sha256: c86123324228a33ab2e1044f48b5205c06fc7b900fd44b17ff5c4f5fbd7201c6

adjustableFields:
  - budgets.tokenBudgetPerAgent
  - budgets.perAttemptMonetaryCeilingCents

failurePolicy:
  stopOnInfrastructureFailure: true
  automaticRetry: false
  replacement: explicit-appended
  eligibleClassification: session-infrastructure-error
