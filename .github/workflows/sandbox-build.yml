name: Sandbox Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/sandbox-build.yml"
      - "containers/puzzle-sandbox/**"
      - "src/cli.ts"
      - "src/fixture/build.ts"
      - "src/sandbox/**"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sandbox-build.yml"
      - "containers/puzzle-sandbox/**"
      - "src/cli.ts"
      - "src/fixture/build.ts"
      - "src/sandbox/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  build:
    name: build sandbox image
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js 26.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.5.0
          package-manager-cache: false

      - name: Install pnpm 10.14.0
        run: |
          npm install --global corepack@0.34.0
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the sandbox image
        run: pnpm puzzle:sandbox:build
