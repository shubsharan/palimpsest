name: Verify

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js 26.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.5.0
          package-manager-cache: false

      - name: Set up Python 3.12.4
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.4

      - name: Set up uv 0.11.14
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.14
          enable-cache: false

      - name: Install pnpm 10.14.0
        run: |
          npm install --global corepack@0.34.0
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - name: Install Docker CLI 29.6.2
        run: |
          curl --fail --location --retry 3 \
            https://download.docker.com/linux/static/stable/x86_64/docker-29.6.2.tgz \
            --output "$RUNNER_TEMP/docker.tgz"
          echo "d6204aea92238e2453d5445c885b9d2e5eb8f82915568ec50edf9dbe12a3ac74  $RUNNER_TEMP/docker.tgz" \
            | sha256sum --check
          mkdir "$RUNNER_TEMP/docker-cli"
          tar --extract --gzip --file "$RUNNER_TEMP/docker.tgz" \
            --directory "$RUNNER_TEMP/docker-cli" --strip-components=1
          echo "$RUNNER_TEMP/docker-cli" >> "$GITHUB_PATH"

      - name: Install Git 2.48.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential gettext libcurl4-gnutls-dev libexpat1-dev \
            libssl-dev zlib1g-dev
          curl --fail --location --retry 3 \
            https://www.kernel.org/pub/software/scm/git/git-2.48.1.tar.xz \
            --output "$RUNNER_TEMP/git.tar.xz"
          echo "1c5d545f5dc1eb51e95d2c50d98fdf88b1a36ba1fa30e9ae5d5385c6024f82ad  $RUNNER_TEMP/git.tar.xz" \
            | sha256sum --check
          mkdir "$RUNNER_TEMP/git-source" "$RUNNER_TEMP/git-install"
          tar --extract --xz --file "$RUNNER_TEMP/git.tar.xz" \
            --directory "$RUNNER_TEMP/git-source" --strip-components=1
          (
            cd "$RUNNER_TEMP/git-source"
            make configure
            ./configure --prefix="$RUNNER_TEMP/git-install"
            make --jobs=2 all
            make install
          )
          echo "$RUNNER_TEMP/git-install/bin" >> "$GITHUB_PATH"

      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --frozen --project python

      - name: Verify exact tool versions
        run: pnpm verify:versions

      - name: Build the current sandbox
        run: pnpm puzzle:sandbox:build

      - name: Run the full verification gate
        run: pnpm verify

      - name: Check changed whitespace
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
        run: |
          base_ref="${BASE_REF#refs/heads/}"
          git diff --check "origin/$base_ref"...HEAD
          git diff --check
