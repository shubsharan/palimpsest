[project]
name = "palimpsest-research"
version = "0.1.0"
description = "Trusted Python research-plane foundation for Palimpsest."
requires-python = "==3.12.4"
dependencies = ["rfc8785==0.1.4"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.0"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["palimpsest"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
markers = [
  "contract: host filesystem and command-line boundary tests",
  "material: full-corpus and checked-in fixture regression tests",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["."]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
